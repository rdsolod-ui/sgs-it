server {
    listen 443 ssl;
    server_name www.sgsit.ru;
    ssl_certificate /etc/letsencrypt/live/sgsit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgsit.ru/privkey.pem;
    return 301 https://sgsit.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name sgsit.ru;
    ssl_certificate /etc/letsencrypt/live/sgsit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgsit.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/sgsit/current/dist;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self' https://web.telegram.org" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ~ /\. { deny all; }
    location = /index.html { expires -1; }
    location = /sw.js { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
