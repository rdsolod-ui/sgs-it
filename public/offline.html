<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ecece8"><meta name="color-scheme" content="light dark"><title>parkops — нет соединения</title>
<style>
:root{--bg:#ecece8;--ink:#202c35;--blue:#2859d9;background:var(--bg);color:var(--ink);color-scheme:light}
:root[data-theme=dark]{--bg:#11171e;--ink:#e6eceb;--blue:#7599ff;color-scheme:dark}
*{box-sizing:border-box}body{font:16px/1.7 Arial;background:var(--bg);margin:0;min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px))}main{max-width:420px}h1{font-size:32px;letter-spacing:-.04em;line-height:1.2}a{color:var(--blue);display:inline-flex;align-items:center;min-height:44px}
</style><script>let theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';try{theme=localStorage.getItem('sgs-theme')||theme}catch{}document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#11171e':'#ecece8';</script></head>
<body><main><small>SGS IT / PARKOPS</small><h1>Вернёмся к разговору,<br>когда появится связь.</h1><p>Для диалога и отправки заявки нужен интернет. Контакты и история не сохраняются в офлайн-кэше.</p><a href="/">Проверить соединение</a></main></body></html>
